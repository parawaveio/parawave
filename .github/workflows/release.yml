name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
      target:
        description: 'Publish target'
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra notebook-test
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  publish:
    name: Publish to ${{ inputs.target }}
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install build tools
        run: uv sync --extra dev
      - name: Validate version matches pyproject.toml
        run: |
          TOML_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TOML_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Version mismatch: pyproject.toml has $TOML_VERSION but workflow input is ${{ inputs.version }}"
            exit 1
          fi
      - name: Set package name for TestPyPI
        if: inputs.target == 'testpypi'
        run: sed -i -e 's/^name = "parawave"/name = "parawave-dev"/' -e 's/parawave\[/parawave-dev\[/g' pyproject.toml
      - name: Build
        run: uv run hatch build
      - name: Check
        run: uv run twine check dist/*
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    if: inputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: parawave v${{ inputs.version }}
          draft: false
          prerelease: false
          body: |
            # parawave v${{ inputs.version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ## Installation
            ```
            pip install parawave
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Tests

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  test-core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra notebook-test
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=parawave --cov-report=term-missing
      - name: Run notebook tests
        run: uv run pytest -p nbval --nbval tests/test_notebook.ipynb -v

[project]
name = "parawave"
version = "0.1.0"
description = "One decorator turns any function into a durable parallel runner."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = [
    "parallel", "async", "concurrency", "retry", "resume",
    "llm", "batch", "synthetic-data", "durable-execution",
    "rate-limiting", "parallel-execution", "local-temporal",
    "openai", "api", "decorator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.19", "aiofiles>=23.0"]
notebook = ["nest_asyncio>=1.5"]
all = ["parawave[sqlite,notebook]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.0",
    "tox>=4.0",
    "tox-uv>=1.0",
    "aiosqlite>=0.19",
    "aiofiles>=23.0",
    "nest_asyncio>=1.5",
    "tqdm>=4.60",
    "hatch>=1.15",
    "twine>=6.0",
]
notebook-test = [
    "parawave[dev]",
    "nbval>=0.11",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:nbval"

[tool.tox]
# Run: tox          (tests 3.9 - 3.13)
# Run: tox -e py313 (single version)
# Add versions: edit env_list below
env_list = ["py39", "py310", "py311", "py312", "py313"]

[tool.tox.env_run_base]
description = "Run tests with pytest"
deps = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.0",
    "aiosqlite>=0.19",
    "aiofiles>=23.0",
    "nest_asyncio>=1.5",
    "tqdm>=4.60",
]
commands = [["pytest", "tests/", "-v", "--tb=short", "--cov=parawave", "--cov-report=term-missing"]]

[tool.hatch.build.targets.wheel]
packages = ["parawave"]
